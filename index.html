<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ThoughtKeeper</title>
  </head>
  <body>
    <div id="app">
      <aside class="sidebar">
        <header class="sidebar-header">
          <h1>🖋️ ThoughtKeeper</h1>
          <button id="new-note" type="button" title="New note (N)">
            New <kbd>N</kbd>
          </button>
        </header>
        <ul id="note-list" class="note-list"></ul>
        <footer class="sidebar-hints">
          <span><kbd>↑</kbd><kbd>↓</kbd> browse</span>
          <span><kbd>F</kbd> focus</span>
          <button id="clear-all" class="clear-all" type="button" hidden>
            <svg
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.3"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M2.6 4.2h10.8" />
              <path d="M6.5 4.2V3a.9.9 0 0 1 .9-.9h1.2a.9.9 0 0 1 .9.9v1.2" />
              <path
                d="M12.3 4.2l-.5 8.5a1.3 1.3 0 0 1-1.3 1.2H5.5a1.3 1.3 0 0 1-1.3-1.2l-.5-8.5"
              />
              <path d="M6.7 6.9v4.2M9.3 6.9v4.2" />
            </svg>
            Clear all
          </button>
        </footer>
      </aside>

      <main class="editor" id="editor">
        <input
          id="note-title"
          class="note-title"
          type="text"
          placeholder="Title"
        />
        <textarea
          id="note-body"
          class="note-body"
          placeholder="Start writing…"
        ></textarea>
        <div id="word-count" class="word-count" aria-hidden="true"></div>
      </main>

      <div class="empty-state" id="empty-state" hidden>
        <p>No note selected</p>
        <p class="empty-hints">
          <kbd>N</kbd> new note · <kbd>↑</kbd><kbd>↓</kbd> browse ·
          <kbd>F</kbd> focus mode
        </p>
        <p class="empty-privacy">
          Notes are saved in this browser only. Nothing is uploaded, and nobody
          else can read them, but clearing your browser data deletes them.
        </p>
      </div>
    </div>

    <div id="scrim" class="scrim"></div>

    <button
      id="exit-focus"
      class="exit-focus"
      type="button"
      title="Toggle sidebar (F)"
      aria-label="Toggle sidebar"
      aria-controls="note-list"
      aria-expanded="true"
    >
      ☰
    </button>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden>
      <span id="toast-message" class="toast-message"></span>
      <button id="toast-undo" class="toast-undo" type="button">Undo</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
